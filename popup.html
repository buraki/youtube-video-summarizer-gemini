<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini YouTube Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <svg class="sparkle-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L14.73 8.35L21.36 9.77L16.29 14.07L17.88 20.65L12 17.06L6.12 20.65L7.71 14.07L2.64 9.77L9.27 8.35L12 2Z" fill="url(#sparkle-grad)"/>
          <defs>
            <linearGradient id="sparkle-grad" x1="2" y1="2" x2="21.36" y2="20.65" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#8ab4f8" />
              <stop offset="50%" stop-color="#a142f4" />
              <stop offset="100%" stop-color="#e8f0fe" />
            </linearGradient>
          </defs>
        </svg>
        <h1>Gemini Video Summarizer</h1>
      </div>
      <p class="subtitle">AI-powered YouTube summaries in seconds</p>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- API Key Section -->
      <section class="settings-group">
        <div class="label-row">
          <label for="api-key">Gemini API Key</label>
          <a href="https://aistudio.google.com/app/apikey" target="_blank" class="helper-link">Get Free Key ↗</a>
        </div>
        <div class="input-wrapper">
          <input type="password" id="api-key" placeholder="Enter your Gemini API Key" spellcheck="false">
          <button id="toggle-key-visibility" class="icon-button" title="Toggle Visibility" type="button">
            <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </section>

      <!-- Language Selector Section -->
      <section class="settings-group">
        <label for="language">Summary Language</label>
        <div class="select-wrapper">
          <select id="language">
            <option value="en">English</option>
            <option value="tr">Türkçe (Turkish)</option>
            <option value="es">Español (Spanish)</option>
            <option value="de">Deutsch (German)</option>
            <option value="fr">Français (French)</option>
            <option value="ru">Русский (Russian)</option>
            <option value="pt">Português (Portuguese)</option>
            <option value="zh">中文 (Chinese)</option>
            <option value="ja">日本語 (Japanese)</option>
            <option value="ko">한국어 (Korean)</option>
          </select>
          <div class="select-arrow"></div>
        </div>
      </section>
      
      <!-- Save & Status -->
      <div class="action-area">
        <button id="save-btn" class="primary-button">
          <span class="btn-text">Save Configuration</span>
          <span class="btn-spinner hidden"></span>
        </button>
        <div id="status-message" class="status-msg hidden"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Click the 3 dots on any YouTube video & select <strong>"Summarize with Gemini"</strong></p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
